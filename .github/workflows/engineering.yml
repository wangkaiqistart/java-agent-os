name: 工程质量门禁

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python3 -m pip install PyYAML==6.0.3
      - run: python3 -m unittest discover -s scripts/tests -p test_verify_react_smoke.py
      - run: python3 scripts/verify-react-migration.py
      - run: bash scripts/check.sh quality
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            **/target/surefire-reports/
            **/target/spotbugs*.xml
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash scripts/install-gitleaks.sh
      - run: bash scripts/check.sh secrets
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 依赖漏洞检查（数据源失败也阻断）
        run: bash scripts/check.sh dependencies
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-reports
          path: target/dependency-check-report.*

  native-runtime:
    name: 原生运行 ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: 记录本轮构建锚点
        shell: bash
        run: python -c "import datetime,os; open(os.environ['GITHUB_ENV'],'a').write('AEGIS_BUILD_ANCHOR='+datetime.datetime.now(datetime.timezone.utc).isoformat()+'\n')"
      - name: Windows软链接权限预检（不能跳过安全测试）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "import tempfile,pathlib,os; d=tempfile.TemporaryDirectory(); p=pathlib.Path(d.name); (p/'target').mkdir(); os.symlink('target',p/'link',target_is_directory=True); assert (p/'link').is_dir()"
      - name: Linux强制SDS全量验证
        if: runner.os == 'Linux'
        run: mvn -B clean verify -Pstatic-analysis -Daegisos.test.require-secure-directory-stream=true
      - name: macOS和Windows原生全量验证
        if: runner.os != 'Linux'
        run: mvn -B clean verify -Pstatic-analysis
      - name: 打包CLI离线与回环持久对话（无真实外呼）
        shell: bash
        run: |
          python scripts/verify-cli-package.py --jar aegisos-boot/target/aegisos-boot-0.1.0-SNAPSHOT.jar --built-after "$AEGIS_BUILD_ANCHOR" --allow-no-strace
          python scripts/verify-cli-runtime.py --jar aegisos-boot/target/aegisos-boot-0.1.0-SNAPSHOT.jar --built-after "$AEGIS_BUILD_ANCHOR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-${{ matrix.os }}-reports
          path: |
            **/target/surefire-reports/
            **/target/spotbugs*.xml
