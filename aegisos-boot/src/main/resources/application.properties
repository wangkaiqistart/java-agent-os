spring.application.name=aegisos
spring.threads.virtual.enabled=true
spring.mvc.log-request-details=false

server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
server.max-http-request-header-size=16KB
server.tomcat.connection-timeout=5s
server.tomcat.keep-alive-timeout=20s
server.tomcat.connection-upload-timeout=5s
server.tomcat.disable-upload-timeout=false
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
aegisos.http.max-json-body-bytes=32768

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

logging.structured.format.console=logstash
logging.level.root=INFO
logging.level.com.aegisos=INFO

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
