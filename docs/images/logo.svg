<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 220" role="img" aria-labelledby="title desc">
  <title id="title">AegisOS</title>
  <desc id="desc">A shield-shaped A with three connected agent nodes and the AegisOS wordmark.</desc>
  <defs>
    <linearGradient id="shield" x1="24" y1="18" x2="186" y2="202" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="0.52" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="246" y1="66" x2="642" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Aegis shield -->
  <path d="M110 14 190 44v54c0 52-33 86-80 108-47-22-80-56-80-108V44z"
        fill="none" stroke="url(#shield)" stroke-width="14" stroke-linejoin="round"/>

  <!-- Stylized A -->
  <path d="m67 155 39-92h10l39 92h-23l-9-23H99l-9 23zm39-42h11l-5.5-17z"
        fill="url(#shield)"/>
  <path d="M91 131h40" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" opacity=".92"/>

  <!-- Agent network -->
  <g fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" opacity=".95" filter="url(#glow)">
    <path d="M110 48v-20M73 78 54 66M147 78l19-12"/>
  </g>
  <g fill="#ecfeff" stroke="#22d3ee" stroke-width="4">
    <circle cx="110" cy="27" r="8"/>
    <circle cx="51" cy="64" r="8"/>
    <circle cx="169" cy="64" r="8"/>
  </g>

  <!-- Wordmark -->
  <text x="242" y="137" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="82" font-weight="750" letter-spacing="-3" fill="url(#wordmark)">Aegis<tspan fill="#0f172a">OS</tspan></text>
  <text x="249" y="176" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="17" font-weight="600" letter-spacing="5" fill="#64748b">AGENT OPERATING SYSTEM</text>
</svg>
