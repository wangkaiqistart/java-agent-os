<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">US1 Provider 调用流程</title>
  <desc id="desc">调用方经公共入口进入统一服务，校验并选择模型，先提交开始审计，再调用模型并提交结束审计，最后返回结果。Profile 和 Provider 注册表来自启动快照。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#64748b"/></marker>
    <style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font-size:16px;font-weight:600}.small{font-size:13px;fill:#475569}.line{fill:none;stroke:#64748b;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="960" height="450" rx="18" fill="#f8fafc"/>
  <text x="36" y="40" font-size="23" font-weight="700">US1：一次模型调用的受控流程</text>
  <text x="36" y="68" class="small">配置在启动时加载；两个公共入口共用同一个 DefaultProviderService。</text>
  <rect x="36" y="105" width="250" height="75" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="161" y="135" text-anchor="middle" class="label">调用方 / 测试</text>
  <text x="161" y="160" text-anchor="middle" class="small">chat 或 chatProfile</text>
  <rect x="355" y="105" width="250" height="75" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="480" y="135" text-anchor="middle" class="label">校验与显式路由</text>
  <text x="480" y="160" text-anchor="middle" class="small">生成 requestId，选择 Provider / 模型</text>
  <rect x="675" y="105" width="250" height="75" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="800" y="135" text-anchor="middle" class="label">① begin 提交</text>
  <text x="800" y="160" text-anchor="middle" class="small">STARTED 落库后才允许外呼</text>
  <path class="line" d="M286 142H350"/><path class="line" d="M605 142H670"/>
  <rect x="675" y="245" width="250" height="75" rx="10" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="800" y="275" text-anchor="middle" class="label">② 模型适配器</text>
  <text x="800" y="300" text-anchor="middle" class="small">协议转换 → 单次模型调用 → 结果转换</text>
  <rect x="355" y="245" width="250" height="75" rx="10" fill="#d1fae5" stroke="#6ee7b7"/>
  <text x="480" y="275" text-anchor="middle" class="label">③ complete 提交</text>
  <text x="480" y="300" text-anchor="middle" class="small">更新 SUCCEEDED / FAILED</text>
  <rect x="36" y="245" width="250" height="75" rx="10" fill="#e0e7ff" stroke="#a5b4fc"/>
  <text x="161" y="275" text-anchor="middle" class="label">返回结果或安全错误</text>
  <text x="161" y="300" text-anchor="middle" class="small">文本 / ToolCall 意图；不执行工具</text>
  <path class="line" d="M800 180V240"/><path class="line" d="M675 282H610"/><path class="line" d="M355 282H291"/>
  <rect x="36" y="365" width="889" height="54" rx="10" fill="#fff7ed" stroke="#fdba74"/>
  <text x="57" y="387" class="small">有限重试：仅允许的临时网络错误 / 超时，最多 1 + maxRetries 次；每次重新 begin → 调用 → complete。</text>
  <text x="57" y="408" class="small">begin 失败阻止该次外呼；complete 失败返回 UNKNOWN 并停止重试。网络等待位于数据库短事务之外。</text>
</svg>
