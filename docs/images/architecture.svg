<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
  <title id="title">AegisOS architecture</title>
  <desc id="desc">AegisOS layers incoming channels into the AgentService and ReAct engine, which use providers, memory, tools and sandbox before persisting sessions and audit data.</desc>
  <defs>
    <linearGradient id="header" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#dbeafe"/>
      <stop offset="1" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="capability" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="storage" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7ed"/>
      <stop offset="1" stop-color="#fed7aa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#64748b"/>
    </marker>
    <style>
      .title { font: 700 32px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #bfdbfe; }
      .section { font: 700 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; letter-spacing: 1px; }
      .node-title { font: 700 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .node-copy { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; }
      .small { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .flow { fill: none; stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1440" height="860" fill="#f8fafc"/>
  <rect x="36" y="28" width="1368" height="112" rx="20" fill="url(#header)" filter="url(#shadow)"/>
  <text x="74" y="76" class="title">AegisOS</text>
  <text x="74" y="108" class="subtitle">Private Java Agent OS runtime · one service, many business agents</text>
  <text x="1362" y="82" text-anchor="end" class="small" fill="#bfdbfe">JDK 21 · Spring Boot 3.x</text>
  <text x="1362" y="108" text-anchor="end" class="small" fill="#bfdbfe">REST · CLI · Scheduler</text>

  <text x="72" y="180" class="section">TRIGGERS AND INTEGRATION</text>
  <rect x="54" y="202" width="1332" height="122" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="88" y="228" width="250" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="368" y="228" width="250" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="648" y="228" width="250" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
    <rect x="1000" y="228" width="352" height="70" rx="14" fill="#f1f5f9" stroke="#94a3b8"/>
  </g>
  <text x="213" y="258" text-anchor="middle" class="node-title">CLI Channel</text>
  <text x="213" y="280" text-anchor="middle" class="node-copy">本地交互与调试</text>
  <text x="493" y="258" text-anchor="middle" class="node-title">REST API</text>
  <text x="493" y="280" text-anchor="middle" class="node-copy">业务系统集成入口</text>
  <text x="773" y="258" text-anchor="middle" class="node-title">Agent Scheduler</text>
  <text x="773" y="280" text-anchor="middle" class="node-copy">cron 自动触发</text>
  <text x="1176" y="258" text-anchor="middle" class="node-title">External Systems</text>
  <text x="1176" y="280" text-anchor="middle" class="node-copy">ERP · CRM · MCP · IM</text>

  <path d="M 213 298 V 372 H 720" class="flow"/>
  <path d="M 493 298 V 372 H 720" class="flow"/>
  <path d="M 773 298 V 372 H 720" class="flow"/>
  <path d="M 1000 263 H 930 V 372 H 720" class="dashed"/>

  <text x="72" y="414" class="section">AGENT ENGINE</text>
  <rect x="54" y="436" width="1332" height="150" rx="18" fill="url(#engine)" stroke="#60a5fa" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="88" y="470" width="285" height="82" rx="14" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="404" y="470" width="285" height="82" rx="14" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="720" y="470" width="285" height="82" rx="14" fill="#ffffff" stroke="#60a5fa"/>
    <rect x="1036" y="470" width="316" height="82" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  </g>
  <text x="230" y="503" text-anchor="middle" class="node-title">AgentService</text>
  <text x="230" y="526" text-anchor="middle" class="node-copy">统一编排三种触发入口</text>
  <text x="546" y="503" text-anchor="middle" class="node-title">ReActLoop</text>
  <text x="546" y="526" text-anchor="middle" class="node-copy">Reason → Act → Observe</text>
  <text x="862" y="503" text-anchor="middle" class="node-title">PromptBuilder</text>
  <text x="862" y="526" text-anchor="middle" class="node-copy">Bootstrap · Memory · History · Tools</text>
  <text x="1194" y="503" text-anchor="middle" class="node-title">ToolExecutor</text>
  <text x="1194" y="526" text-anchor="middle" class="node-copy">调度、校验、审计工具调用</text>

  <path d="M 230 552 V 632 H 720" class="flow"/>
  <path d="M 546 552 V 632 H 720" class="flow"/>
  <path d="M 862 552 V 632 H 720" class="flow"/>
  <path d="M 1194 552 V 632 H 720" class="flow"/>

  <text x="72" y="674" class="section">CAPABILITIES AND SAFETY</text>
  <rect x="54" y="696" width="1332" height="122" rx="18" fill="url(#capability)" stroke="#34d399" stroke-width="2"/>
  <g filter="url(#shadow)">
    <rect x="88" y="722" width="250" height="70" rx="14" fill="#ffffff" stroke="#34d399"/>
    <rect x="368" y="722" width="250" height="70" rx="14" fill="#ffffff" stroke="#34d399"/>
    <rect x="648" y="722" width="250" height="70" rx="14" fill="#ffffff" stroke="#34d399"/>
    <rect x="928" y="722" width="250" height="70" rx="14" fill="#ffffff" stroke="#34d399"/>
    <rect x="1208" y="722" width="144" height="70" rx="14" fill="#ffffff" stroke="#34d399"/>
  </g>
  <text x="213" y="752" text-anchor="middle" class="node-title">Provider</text>
  <text x="213" y="774" text-anchor="middle" class="node-copy">LLM 路由</text>
  <text x="493" y="752" text-anchor="middle" class="node-title">MemoryService</text>
  <text x="493" y="774" text-anchor="middle" class="node-copy">Session + Long-term</text>
  <text x="773" y="752" text-anchor="middle" class="node-title">ToolRegistry</text>
  <text x="773" y="774" text-anchor="middle" class="node-copy">内置 · MCP · Java</text>
  <text x="1053" y="752" text-anchor="middle" class="node-title">Sandbox</text>
  <text x="1053" y="774" text-anchor="middle" class="node-copy">Path · Shell · HTTP</text>
  <text x="1280" y="752" text-anchor="middle" class="node-title">MCP</text>
  <text x="1280" y="774" text-anchor="middle" class="node-copy">外部工具</text>

  <rect x="54" y="832" width="1332" height="8" rx="4" fill="url(#storage)"/>
  <text x="72" y="856" class="small">Persistence: SQLite for sessions and audit records · .aegisos/ filesystem for Agent directories, Bootstrap files and Memory</text>
</svg>
